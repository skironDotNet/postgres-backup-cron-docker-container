services:
  postgres-backup:
    image: postgres-backup-cron
    container_name: postgres-backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      SCHEDULE_EXPR: "0 2 * * *" # adjust the cron job schedule here
      TZ: America/Chicago
      PGHOST: pgsql # assuming you run pgsql as container, use your container name as hostname 
      PGPORT: "5432"
      PGUSER: backup_job # create such user, or change it here, the PGPASSWORD goes to backup.env
      PGDATABASE: postgres # default DB just because, leave as is
      BACKUP_DIR: /backups # location in the container, leave as is
    volumes:
      - /srv/backups/postgresql:/backups # adjust your host dir location
    networks:
      - postgres-network # just an assumption. Use same netwrok where you host pgsql server container

networks:
  postgres-network: # just an assumption. Use same netwrok where you host pgsql server container
    external: true

# About network. May be a good idea to take this postgres-backup service and 
# add it to your pg server docker-compose.yml, this way can start the server 
# and the backup cron from same command, they will both be automatically on the same network
# so you can skip the `netwrok` sections
